# Docker Compose — tumpukan backend Vienna (satu VPS)
# Spec: vault "AI Dev Company Infrastructure" (postgres/redis/qdrant
# persisten) + keputusan arsitektur VPS 13 Nov 2026 (batas RAM per
# container; hanya backend yang dipetakan ke host itupun localhost;
# PostgreSQL/Qdrant/MCP/Redis jaringan internal saja; MongoDB TETAP
# cloud Atlas sesuai desain dashboard — sengaja bukan container).
#
# Tata letak WAJIB: folder Vienna_Agent dan MCPServer bersebelahan
# (di laptop ~/Desktop/, di VPS mis. ~/apps/), karena service mcp
# di-build dari ../MCPServer dengan Dockerfile-nya sendiri.
#
# Kredensial: semua dari .env folder ini (chmod 600, JANGAN di-commit).
# POSTGRES_USER/POSTGRES_DB/POSTGRES_PASSWORD dipakai bersama oleh
# container postgres dan DATABASE_URL backend — satu sumber, selalu sinkron.
#
# Jalankan:  docker compose up -d --build
# Cek:       docker compose ps && curl http://127.0.0.1:8000/health
#
# opencode serve TIDAK di-container-kan: ia tetap jalan di host VPS
# sebagai DUA instance systemd — admin :4096 dan publik :4097 (lihat
# opencode-core/). Backend menjangkau keduanya lewat
# host.docker.internal (env OPENCODE_ADMIN_BASE_URL /
# OPENCODE_PUBLIC_BASE_URL di service backend). Sebaliknya, publish
# dashboard menulis config opencode-core + salinan live agent publik
# di HOST — karena itu dua folder itu di-bind-mount ke container
# backend; tanpa mount, publish hanya menulis ke filesystem container
# dan tidak pernah sampai ke serve.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vienna-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      # Override alamat antar-container (nilai localhost di .env hanya
      # untuk jalan bare-metal di laptop).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vienna}:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@postgres:5432/${POSTGRES_DB:-vienna_dashboard}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MCP_URL: http://mcp:8001/mcp
      OPENCODE_BASE_URL: http://host.docker.internal:4096
      # Dua instance opencode-core di host (isolasi per role). Tanpa
      # override ini role publik jatuh ke 127.0.0.1:4097 DI DALAM
      # container (= container itu sendiri) dan Assistant mati.
      OPENCODE_ADMIN_BASE_URL: http://host.docker.internal:4096
      OPENCODE_PUBLIC_BASE_URL: http://host.docker.internal:4097
      # Salinan live config agent publik di host (lihat volumes).
      OPENCODE_PUBLIC_DIR: /app/agent-public
      # Direktori kerja agent admin di host (lihat volumes) — backend
      # membaca dari sini file yang dibuat/diubah agent untuk
      # dikembalikan sebagai lampiran "files" di akhir giliran chat.
      OPENCODE_ADMIN_DIR: /app/admin-workspace
    volumes:
      # Publish dashboard harus menulis ke file yang dibaca serve di
      # host, bukan ke salinan di dalam image.
      - ./opencode-core:/app/opencode-core
      - ../agent-public:/app/agent-public
      # Dibaca backend untuk lampiran file hasil kerja agent admin.
      # Foldernya WAJIB sudah ada sebelum `docker compose up` pertama
      # (dibuat start-admin.sh di host / mkdir manual) — bila Docker
      # yang membuatnya, folder jadi milik root dan serve di host
      # tidak bisa menulis ke dalamnya.
      - ./admin-workspace:/app/admin-workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Hanya localhost VPS — akses publik nanti via reverse proxy
      # (api.amamiya.web.id), bukan dengan membuka port ini.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp:
        condition: service_started
    mem_limit: 2g
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mcp:
    build:
      context: ../MCPServer
      dockerfile: Dockerfile
    image: agentmcp-server:local
    container_name: vienna-mcp
    restart: unless-stopped
    env_file:
      - path: ../MCPServer/.env
        required: false
    environment:
      SSE_PORT: "8001"
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
    # Backend memanggil http://mcp:8001/mcp lewat jaringan internal.
    # Port host HANYA localhost: instance opencode-core di host
    # (config-nya menunjuk 127.0.0.1:8001/mcp) harus bisa menjangkau
    # MCP ini juga — tanpa baris ini agent kehilangan tool MCP-nya.
    ports:
      - "127.0.0.1:8001:8001"
    expose:
      - "8001"
    depends_on:
      qdrant:
        condition: service_started
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: vienna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vienna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-vienna_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tanpa ports: hanya backend lewat jaringan internal.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vienna} -d ${POSTGRES_DB:-vienna_dashboard}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vienna-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # Tanpa ports: hanya backend & mcp lewat jaringan internal.
    expose:
      - "6333"
      - "6334"
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: vienna-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # Tanpa ports: hanya backend lewat jaringan internal.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  qdrant_storage:
  redis_data:
